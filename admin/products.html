<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — NOVA SAAS STUDIO Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;line-height:1.6;overflow-x:hidden}
    ::selection{background:#0066FF;color:#fff}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0a0a0a}
    ::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:3px}

    .layout{display:flex;min-height:100vh}
    .sidebar{width:240px;background:rgba(255,255,255,0.02);border-right:1px solid rgba(255,255,255,0.05);padding:24px 16px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
    .sidebar-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff;margin-bottom:32px;text-decoration:none}
    .sidebar-nav{display:flex;flex-direction:column;gap:4px}
    .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;color:#888;text-decoration:none;transition:all .2s}
    .sidebar-nav a:hover{background:rgba(255,255,255,0.04);color:#e0e0e0}
    .sidebar-nav a.active{background:rgba(0,102,255,0.1);color:#0066FF}
    .sidebar-nav a.logout{margin-top:auto;color:#555}
    .sidebar-nav a.logout:hover{color:#ff4444;background:rgba(255,68,68,0.06)}
    .sidebar-nav div:empty{flex:1}

    .main{margin-left:240px;flex:1;padding:32px 40px;min-height:100vh}
    .main-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px}
    .main-header h1{font-size:26px;font-weight:800;color:#fff}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:all .3s;text-decoration:none}
    .btn-primary{background:linear-gradient(135deg,#0066FF,#0052CC);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,102,255,0.35)}
    .btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
    .btn-danger{background:rgba(255,68,68,0.15);color:#ff4444}
    .btn-danger:hover{background:rgba(255,68,68,0.25)}
    .btn-edit{background:rgba(0,102,255,0.15);color:#0066FF}
    .btn-edit:hover{background:rgba(0,102,255,0.25)}

    .search-bar{margin-bottom:20px}
    .search-bar input{width:100%;max-width:400px;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e0e0e0;font-size:14px;font-family:inherit;outline:none;transition:border-color .3s}
    .search-bar input:focus{border-color:#0066FF}
    .search-bar input::placeholder{color:#555}

    .table-container{overflow-x:auto;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#666;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06)}
    td{padding:14px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .product-name{color:#fff;font-weight:600}
    .product-cat{color:#0066FF;font-size:12px}
    .product-price{color:#00D4FF;font-weight:600}
    .action-cell{display:flex;gap:6px}

    .empty-state{text-align:center;padding:60px 24px;color:#666}
    .empty-state h3{color:#fff;font-size:20px;margin-bottom:8px}
    .empty-state p{margin-bottom:16px}

    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:2000;display:none;align-items:center;justify-content:center;padding:24px}
    .modal-overlay.show{display:flex}
    .modal{background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:32px}
    .modal h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:20px}
    .modal .form-group{margin-bottom:14px}
    .modal .form-group label{display:block;font-size:13px;font-weight:600;color:#999;margin-bottom:6px}
    .modal .form-group input,.modal .form-group textarea,.modal .form-group select{width:100%;padding:10px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e0e0e0;font-size:13px;font-family:inherit;outline:none;transition:border-color .3s}
    .modal .form-group input:focus,.modal .form-group textarea:focus,.modal .form-group select:focus{border-color:#0066FF}
    .modal .form-group textarea{min-height:80px;resize:vertical}
    .modal .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .modal .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
    .modal .btn-secondary{background:rgba(255,255,255,0.05);color:#999;border:1px solid rgba(255,255,255,0.1);padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .3s}
    .modal .btn-secondary:hover{background:rgba(255,255,255,0.1);color:#fff}

    .footer-text{text-align:center;color:#555;font-size:12px;padding:20px 0}

    @media(max-width:768px){
      .sidebar{width:60px;padding:16px 8px}
      .sidebar-logo span,.sidebar-nav a span{display:none}
      .sidebar-nav a{justify-content:center;padding:10px}
      .main{margin-left:60px;padding:24px 16px}
      .modal .form-row{grid-template-columns:1fr}
      .action-cell{flex-direction:column}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a href="/novasaas/admin/" class="sidebar-logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" rx="8" stroke="#0066FF" stroke-width="2"/><path d="M10 22V14l6 8V10" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>NOVA Admin</span>
      </a>
      <nav class="sidebar-nav" style="display:flex;flex-direction:column;height:calc(100vh - 100px)">
        <a href="/novasaas/admin/"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="2" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="10" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg><span>Dashboard</span></a>
        <a href="/novasaas/admin/products.html" class="active"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M6 5h6M6 9h6M6 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Products</span></a>
        <a href="/novasaas/admin/orders.html"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 6h6M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Orders</span></a>
        <a href="/novasaas/admin/customers.html"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M3 16c0-4 3-6 6-6s6 2 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Customers</span></a>
        <div style="flex:1"></div>
        <a href="#" class="logout" onclick="logout()"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M6 15H4a1 1 0 01-1-1V4a1 1 0 011-1h2M12 11l3-3-3-3M15 8H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Logout</span></a>
      </nav>
    </aside>
    <main class="main">
      <div class="main-header">
        <h1>Products</h1>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Product</button>
      </div>
      <div class="search-bar"><input type="text" id="searchInput" placeholder="Search products..." oninput="renderTable()"></div>
      <div class="table-container"><div id="productsContainer"></div></div>
      <div class="footer-text">&copy; 2025 NOVA SAAS STUDIO Admin</div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h2 id="modalTitle">Add Product</h2>
      <input type="hidden" id="editId">
      <div class="form-group"><label>Product Name</label><input type="text" id="fName" placeholder="NovaProduct"></div>
      <div class="form-group"><label>Tagline</label><input type="text" id="fTagline" placeholder="Short description"></div>
      <div class="form-group"><label>Description</label><textarea id="fDesc" placeholder="Full product description..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Category</label><select id="fCat"><option>CRM</option><option>Chat</option><option>Analytics</option><option>Finance</option><option>AI</option><option>Productivity</option></select></div>
        <div class="form-group"><label>Icon</label><select id="fIcon"><option value="crm">CRM</option><option value="chat">Chat</option><option value="analytics">Analytics</option><option value="invoice">Invoice</option><option value="ai">AI</option><option value="docs">Docs</option></select></div>
      </div>
      <div class="form-group"><label>Features (one per line)</label><textarea id="fFeatures" placeholder="AI-powered lead scoring&#10;Automated contact management&#10;Deal pipeline tracking" rows="4"></textarea></div>
      <div class="form-group"><label>Starter Price ($/mo)</label><input type="number" id="fStarterPrice" placeholder="29" min="1"></div>
      <div class="form-group"><label>Pro Price ($/mo)</label><input type="number" id="fProPrice" placeholder="79" min="1"></div>
      <div class="form-group"><label>Enterprise Price ($/mo)</label><input type="number" id="fEntPrice" placeholder="199" min="1"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('nova_admin_auth') !== 'true') window.location.href = '/novasaas/admin/login.html';
    function logout() { localStorage.removeItem('nova_admin_auth'); window.location.href = '/novasaas/admin/login.html'; }

    function getProducts() { let p = localStorage.getItem('nova_products'); return p ? JSON.parse(p) : []; }
    function saveProducts(p) { localStorage.setItem('nova_products', JSON.stringify(p)); }

    function renderTable() {
      let products = getProducts();
      const q = (document.getElementById('searchInput').value || '').toLowerCase();
      if (q) products = products.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
      const container = document.getElementById('productsContainer');

      if (products.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No products</h3><p>Add your first product to get started.</p></div>';
        return;
      }

      container.innerHTML = '<table><thead><tr><th>Name</th><th>Category</th><th>Price Range</th><th>Features</th><th>Actions</th></tr></thead><tbody>' +
        products.map((p,i) => {
          const prices = p.pricing.map(pl => '$' + pl.price);
          return '<tr><td><div class="product-name">' + p.name + '</div><div style="font-size:12px;color:#666">' + (p.tagline || '') + '</div></td><td><span class="product-cat">' + p.category + '</span></td><td class="product-price">' + prices.join(' - ') + '</td><td style="color:#888;font-size:12px">' + (p.features ? p.features.length : 0) + ' features</td><td class="action-cell"><button class="btn btn-edit btn-sm" onclick="openEditModal(' + i + ')">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteProduct(' + i + ')">Delete</button></td></tr>';
        }).join('') + '</tbody></table>';
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Product';
      document.getElementById('editId').value = '';
      ['fName','fTagline','fDesc','fFeatures','fStarterPrice','fProPrice','fEntPrice'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fCat').value = 'CRM';
      document.getElementById('fIcon').value = 'crm';
      document.getElementById('productModal').classList.add('show');
    }

    function openEditModal(idx) {
      const products = getProducts();
      const p = products[idx];
      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('editId').value = idx;
      document.getElementById('fName').value = p.name;
      document.getElementById('fTagline').value = p.tagline || '';
      document.getElementById('fDesc').value = p.description || '';
      document.getElementById('fCat').value = p.category;
      document.getElementById('fIcon').value = p.icon || 'crm';
      document.getElementById('fFeatures').value = (p.features || []).join('\n');
      document.getElementById('fStarterPrice').value = p.pricing[0] ? p.pricing[0].price : '';
      document.getElementById('fProPrice').value = p.pricing[1] ? p.pricing[1].price : '';
      document.getElementById('fEntPrice').value = p.pricing[2] ? p.pricing[2].price : '';
      document.getElementById('productModal').classList.add('show');
    }

    function closeModal() { document.getElementById('productModal').classList.remove('show'); }

    function saveProduct() {
      const idx = document.getElementById('editId').value;
      const name = document.getElementById('fName').value.trim();
      if (!name) { alert('Product name is required.'); return; }
      const tagline = document.getElementById('fTagline').value.trim();
      const desc = document.getElementById('fDesc').value.trim();
      const cat = document.getElementById('fCat').value;
      const icon = document.getElementById('fIcon').value;
      const features = document.getElementById('fFeatures').value.split('\n').filter(f => f.trim()).map(f => f.trim());
      const starterP = parseInt(document.getElementById('fStarterPrice').value) || 0;
      const proP = parseInt(document.getElementById('fProPrice').value) || 0;
      const entP = parseInt(document.getElementById('fEntPrice').value) || 0;

      const product = {
        id: idx !== '' ? getProducts()[idx].id : 'p' + Date.now(),
        name, tagline, description: desc, category: cat, icon,
        features: features.length ? features : ['Feature 1', 'Feature 2', 'Feature 3'],
        pricing: [
          { name:'Starter', price:starterP || 19, period:'/mo', popular:false, features:['Up to basic usage','Email support'] },
          { name:'Pro', price:proP || 49, period:'/mo', popular:true, features:['Advanced features','Priority support'] },
          { name:'Enterprise', price:entP || 99, period:'/mo', popular:false, features:['Everything unlimited','Dedicated support'] }
        ],
        screenshots: ['dashboard', 'analytics', 'settings']
      };

      let products = getProducts();
      if (idx !== '') {
        products[parseInt(idx)] = product;
      } else {
        products.push(product);
      }
      saveProducts(products);
      closeModal();
      renderTable();
    }

    function deleteProduct(idx) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      let products = getProducts();
      products.splice(idx, 1);
      saveProducts(products);
      renderTable();
    }

    document.addEventListener('DOMContentLoaded', renderTable);
  </script>
</body>
</html>
